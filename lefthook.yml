pre-commit:
  parallel: true
  commands:
    biome_format:
      glob: "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"
      run: npx biome format --write {staged_files}
      stage_fixed: true
    biome_lint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: npx biome lint {staged_files}
    tsc:
      run: npm run typecheck --workspaces --if-present
    test:
      run: npm test --workspaces --if-present
