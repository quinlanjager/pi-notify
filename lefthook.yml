pre-commit:
  parallel: true
  commands:
    format:
      glob: "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"
      run: npm run format
      stage_fixed: true
    lint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: npm run lint
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
